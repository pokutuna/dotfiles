# preferred_auth_method = "apikey"
# model_provider = "litellm"
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
personality = "pragmatic"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "user"
service_tier = "default"

[tui]
notifications = true
notification_method = "auto"
notification_condition = "always"

notify = [
  "/Users/pokutuna/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
  "turn-ended",
]

[model_providers.litellm]
name = "LiteLLM"
base_url = "https://llmproxy.hatena.sh/"
wire_api = "responses"
# env_key = "OPENAI_API_KEY"
stream_max_retries = 50

[mcp_servers.deepwiki]
url = "http://localhost:7683/deepwiki/mcp"

[mcp_servers.chrome-tabs]
url = "http://localhost:7683/chrome-tabs/mcp"

[mcp_servers.chrome-tabs.tools.list_tabs]
approval_mode = "approve"

[mcp_servers.chrome-tabs.tools.read_tab_content]
approval_mode = "approve"

[mcp_servers.chrome-tabs.tools.open_in_new_tab]
approval_mode = "approve"

[mcp_servers.google-search]
url = "http://localhost:7683/google-search/mcp"

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/pokutuna/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/pokutuna/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.915.31029"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/pokutuna/.codex/plugins/cache/openai-bundled/browser/26.915.31029/scripts/browser-service.mjs","sky":"@oai/sky/service"}'
SKY_CUA_SERVICE_PATH = "/Users/pokutuna/.codex/computer-use/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false


[features]
hooks = true
js_repl = false

[desktop]
conversationDetailMode = "STEPS_PROSE"
ambient-suggestions-enabled = true
followUpQueueMode = "queue"

[notice]
hide_full_access_warning = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."cloud-logging@pokutuna-plugins"]
enabled = true

[plugins."difit@pokutuna-plugins"]
enabled = true

[plugins."google-style-guide@pokutuna-plugins"]
enabled = true

[plugins."things-app@pokutuna-plugins"]
enabled = true

[plugins."uv-features@pokutuna-plugins"]
enabled = true

[plugins."docgen@pokutuna-plugins"]
enabled = true

[plugins."test-quality@pokutuna-plugins"]
